<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Friend AI Chat</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>Conversations</h1>
          <button id="newConversationBtn" class="secondary">New</button>
        </div>
        <ul id="conversationList" class="conversation-list"></ul>
      </aside>

      <section class="chat-panel">
        <header class="chat-header">
          <h2 id="chatTitle">New Conversation</h2>
          <p id="statusText" class="status idle">Idle</p>
        </header>

        <div id="errorBanner" class="error-banner hidden" role="alert"></div>

        <div id="messageList" class="message-list" aria-live="polite"></div>

        <form id="composer" class="composer">
          <textarea
            id="messageInput"
            rows="2"
            placeholder="Type a message..."
            required
          ></textarea>
          <button id="sendBtn" type="submit">Send</button>
        </form>
      </section>
    </main>

    <template id="messageTemplate">
      <article class="message-row">
        <div class="bubble"></div>
      </article>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
